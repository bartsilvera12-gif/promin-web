<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./symbol.png">
<link rel="apple-touch-icon" href="./symbol.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #1A2026; color: #EDEFF2; }
  a { color: #DE694E; text-decoration: none; }
  a:hover { color: #E8714F; }
  ::selection { background: #DE694E; color: #151A1F; }
  @keyframes promin-blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  /* group headers */
  .promin-galgroup { margin-bottom: clamp(48px,7vw,86px); }
  .promin-galgroup:last-child { margin-bottom: 0; }
  .promin-galgroup-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 0 0 22px; padding-bottom: 16px; border-bottom: 1px solid rgba(217,220,224,.1); flex-wrap: wrap; }
  .promin-galgroup-head .kick { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #DE694E; letter-spacing: 1.5px; text-transform: uppercase; display: block; margin-bottom: 8px; }
  .promin-galgroup-head h2 { font-size: clamp(22px,3vw,34px); font-weight: 700; letter-spacing: -.6px; color: #F4F6F8; margin: 0; line-height: 1.15; }
  .promin-galgroup-head .cnt { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6E7681; white-space: nowrap; }
  /* filtros de categoría */
  .promin-gal-filters { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 16px; margin: 0 0 30px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .promin-gal-filters::-webkit-scrollbar { height: 6px; }
  .promin-gal-filters::-webkit-scrollbar-thumb { background: rgba(222,105,78,.4); border-radius: 99px; }
  .promin-gal-fbtn { flex: none; white-space: nowrap; background: #171D24; border: 1px solid rgba(217,220,224,.12); color: #C9CDD2; font-family: inherit; font-size: 13.5px; font-weight: 500; padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
  .promin-gal-fbtn:hover { border-color: rgba(222,105,78,.5); color: #EDEFF2; }
  .promin-gal-fbtn.on { background: #DE694E; border-color: #DE694E; color: #151A1F; font-weight: 600; }
  .promin-gal-fbtn .n { opacity: .6; font-size: 11px; margin-left: 5px; font-family: 'JetBrains Mono', monospace; }
  /* masonry grid */
  .promin-gal-grid { columns: 4; column-gap: 14px; }
  .promin-gal-item { break-inside: avoid; margin: 0 0 14px; position: relative; border-radius: 14px; overflow: hidden; cursor: zoom-in; display: block; width: 100%; padding: 0; border: 0; background: #0E1317; line-height: 0; }
  .promin-gal-item img { width: 100%; height: auto; display: block; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .promin-gal-item::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(18,23,28,.7)); opacity: 0; transition: opacity .3s ease; }
  .promin-gal-item:hover img { transform: scale(1.06); }
  .promin-gal-item:hover::after { opacity: 1; }
  @media (max-width: 1100px) { .promin-gal-grid { columns: 3; } }
  @media (max-width: 768px) { .promin-gal-grid { columns: 2; } }
  @media (max-width: 520px) { .promin-gal-grid { columns: 1; } }
  /* lightbox */
  .promin-lb { position: fixed; inset: 0; z-index: 9999; background: rgba(9,12,15,.95); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 30px; }
  .promin-lb.open { display: flex; }
  .promin-lb img { max-width: 94vw; max-height: 84vh; object-fit: contain; border-radius: 8px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .promin-lb-close { position: absolute; top: 16px; right: 20px; background: none; border: 0; color: #EDEFF2; font-size: 34px; line-height: 1; cursor: pointer; z-index: 3; }
  .promin-lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(18,23,28,.5); border: 1px solid rgba(237,239,242,.25); color: #EDEFF2; width: 48px; height: 48px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s, color .2s; z-index: 3; }
  .promin-lb-nav:hover { background: #DE694E; border-color: #DE694E; color: #151A1F; }
  .promin-lb-prev { left: 16px; } .promin-lb-next { right: 16px; }
  .promin-lb-meta { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: #C6CCD2; z-index: 3; padding: 0 20px; }
  .promin-lb-meta .cat { color: #DE694E; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .promin-lb-meta .pos { font-size: 13px; }
  @media (max-width: 560px) { .promin-lb-nav { width: 42px; height: 42px; } .promin-lb img { max-height: 76vh; } }
  @media (prefers-reduced-motion: reduce) { .promin-gal-item img { transition: none; } }
</style>
</helmet>

<div style="font-family:'Sora',sans-serif;background:#1A2026;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column">
  <div data-progress style="position:fixed;top:0;left:0;height:3px;width:100%;background:#DE694E;transform:scaleX(0);transform-origin:0 50%;z-index:950"></div>
  <dc-import name="Nav" active="galeria" hint-size="100%,90px"></dc-import>

  <!-- HERO -->
  <section style="position:relative;padding:170px clamp(20px,5vw,64px) 44px;background:radial-gradient(110% 80% at 80% 0%, #22303f 0%, #1A2026 60%);overflow:hidden">
    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(217,220,224,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(217,220,224,.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 70% 20%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 70% 20%,#000,transparent 75%)"></div>
    <div style="position:relative;max-width:1280px;margin:0 auto">
      <div data-reveal="up" style="display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#DE694E;margin-bottom:24px"><span style="width:8px;height:8px;background:#DE694E;border-radius:50%;animation:promin-blink 2s infinite"></span>{{ L.kicker }}</div>
      <h1 data-reveal="up" data-reveal-delay="70" style="font-size:clamp(34px,5.5vw,64px);line-height:1.04;font-weight:700;letter-spacing:-1.5px;margin:0 0 18px;max-width:18ch;color:#F4F6F8">{{ L.title }}</h1>
      <p data-reveal="up" data-reveal-delay="130" style="font-size:clamp(16px,1.5vw,19px);line-height:1.65;color:#A9B0B8;font-weight:300;max-width:60ch;margin:0">{{ L.lede }}</p>
    </div>
  </section>

  <!-- GRUPOS POR CATEGORÍA (poblados por JS) -->
  <section style="padding:clamp(30px,5vw,64px) clamp(20px,5vw,64px) clamp(60px,8vw,110px);max-width:1280px;margin:0 auto;width:100%;overflow:hidden;flex:1">
    <div class="promin-gal-filters" data-gal-filters></div>
    <div data-gal-groups></div>
    <div data-gal-empty style="display:none;color:#6E7681;font-size:15px;padding:40px 0">{{ L.empty }}</div>
  </section>

  <!-- Lightbox -->
  <div class="promin-lb" data-gal-lb role="dialog" aria-modal="true" aria-label="Galería de servicios">
    <button class="promin-lb-close" data-lb-close aria-label="Cerrar">×</button>
    <button class="promin-lb-nav promin-lb-prev" data-lb-prev aria-label="Anterior">‹</button>
    <img alt="" />
    <button class="promin-lb-nav promin-lb-next" data-lb-next aria-label="Siguiente">›</button>
    <div class="promin-lb-meta"><span class="cat" data-lb-cat></span><span class="pos" data-lb-pos></span></div>
  </div>

  <dc-import name="Footer" hint-size="100%,420px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  lang() { try { return localStorage.getItem('promin_lang') === 'es' ? 'es' : 'pt'; } catch (e) { return 'pt'; } }
  componentDidMount() {
    import('./site.js').then(m => m.initMotion()).catch(() => {});
    this.initGallery();
  }

  initGallery() {
    const lang = this.lang();
    setTimeout(() => {
      const wrap = document.querySelector('[data-gal-groups]');
      const lb = document.querySelector('[data-gal-lb]');
      const emptyEl = document.querySelector('[data-gal-empty]');
      if (!wrap || this._galInit) return;
      if (emptyEl) { emptyEl.textContent = lang === 'es' ? 'Cargando galería…' : 'Carregando galeria…'; emptyEl.style.display = 'block'; }
      const loadGallery = () =>
        fetch('api/gallery.php?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() =>
          fetch('data/gallery.json?t=' + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() =>
            fetch('data/gallery.seed.json?t=' + Date.now()).then(r => r.json())));
      loadGallery().then(data => {
        const imgs = (data.images || [])
          .filter(im => im.active !== false)
          .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
          .map(im => ({ cat: im.category, w: im.w, h: im.h, g480: im.thumbnail || im.src, g900: im.thumbnail || im.src, full: im.src, srcset: im.srcset || '', altEs: im.alt || '', altPt: im.alt_pt || im.alt || '' }));
        const cats = (data.categories || []).map(c => ({ slug: c.slug, es: c.es, pt: c.pt, count: imgs.filter(i => i.cat === c.slug).length })).filter(c => c.count > 0);
        if (!cats.length || !imgs.length) { if (emptyEl) { emptyEl.textContent = this.renderVals().L.empty; emptyEl.style.display = 'block'; } return; }
        if (emptyEl) emptyEl.style.display = 'none';
        this._galInit = true;
        const label = (slug) => { const c = cats.find(x => x.slug === slug); return c ? (lang === 'es' ? c.es : c.pt) : slug; };
        const alt = (im) => lang === 'es' ? im.altEs : im.altPt;

        // Lightbox
        let current = [], lbi = 0;
        const lbImg = lb.querySelector('img'), lbPos = lb.querySelector('[data-lb-pos]'), lbCat = lb.querySelector('[data-lb-cat]');
        const showLB = () => { const im = current[lbi]; lbImg.src = im.full; lbImg.alt = alt(im); lbPos.textContent = (lbi + 1) + ' / ' + current.length; lbCat.textContent = label(im.cat); };
        const openLB = (list, i) => { current = list; lbi = i; showLB(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; };
        const closeLB = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
        const nav = (d) => { lbi = (lbi + d + current.length) % current.length; showLB(); };
        lb.querySelector('[data-lb-close]').addEventListener('click', closeLB);
        lb.querySelector('[data-lb-prev]').addEventListener('click', (e) => { e.stopPropagation(); nav(-1); });
        lb.querySelector('[data-lb-next]').addEventListener('click', (e) => { e.stopPropagation(); nav(1); });
        lb.addEventListener('click', (e) => { if (e.target === lb) closeLB(); });
        document.addEventListener('keydown', (e) => { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') closeLB(); else if (e.key === 'ArrowRight') nav(1); else if (e.key === 'ArrowLeft') nav(-1); });

        // Un grupo por carpeta/categoría
        cats.forEach((c, ci) => {
          const list = imgs.filter(im => im.cat === c.slug);
          if (!list.length) return;
          const group = document.createElement('div');
          group.className = 'promin-galgroup';
          group.dataset.cat = c.slug;
          const head = document.createElement('div');
          head.className = 'promin-galgroup-head';
          head.innerHTML = '<div><span class="kick">// ' + String(ci + 1).padStart(2, '0') + '</span><h2>' + label(c.slug) + '</h2></div>'
            + '<span class="cnt">' + list.length + (lang === 'es' ? ' fotos' : ' fotos') + '</span>';
          group.appendChild(head);
          const grid = document.createElement('div');
          grid.className = 'promin-gal-grid';
          list.forEach((im, idx) => {
            const b = document.createElement('button'); b.type = 'button'; b.className = 'promin-gal-item';
            const img = document.createElement('img');
            img.src = im.g480;
            if (im.srcset) img.srcset = im.srcset;
            img.sizes = '(max-width:520px) 100vw, (max-width:768px) 50vw, (max-width:1100px) 33vw, 25vw';
            img.width = im.w; img.height = im.h; img.loading = 'lazy'; img.decoding = 'async'; img.alt = alt(im);
            b.appendChild(img);
            b.addEventListener('click', () => openLB(list, idx));
            grid.appendChild(b);
          });
          group.appendChild(grid);
          wrap.appendChild(group);
        });

        // Filtros de categoría (arriba): "Todas" + una por carpeta
        const filtersEl = document.querySelector('[data-gal-filters]');
        if (filtersEl) {
          const allLabel = lang === 'es' ? 'Todas' : 'Todas';
          const filters = [{ slug: 'all', count: imgs.length, name: allLabel }]
            .concat(cats.map(c => ({ slug: c.slug, count: c.count, name: label(c.slug) })));
          const applyFilter = (slug, btn) => {
            filtersEl.querySelectorAll('.promin-gal-fbtn').forEach(x => x.classList.remove('on'));
            btn.classList.add('on');
            wrap.querySelectorAll('.promin-galgroup').forEach(g => { g.style.display = (slug === 'all' || g.dataset.cat === slug) ? '' : 'none'; });
            window.scrollTo({ top: filtersEl.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
          };
          filters.forEach((f, i) => {
            const b = document.createElement('button');
            b.className = 'promin-gal-fbtn' + (i === 0 ? ' on' : '');
            b.innerHTML = f.name + '<span class="n">' + f.count + '</span>';
            b.addEventListener('click', () => applyFilter(f.slug, b));
            filtersEl.appendChild(b);
          });
        }
      }).catch(() => { if (emptyEl) { emptyEl.textContent = lang === 'es' ? 'No se pudo cargar la galería. Recargá la página.' : 'Não foi possível carregar a galeria. Recarregue a página.'; emptyEl.style.display = 'block'; } });
    }, 80);
  }

  renderVals() {
    const lang = this.lang();
    const pt = {
      kicker: 'Galeria',
      title: 'Nossos serviços em ação.',
      lede: 'Registros reais de campo, organizados por serviço: manutenção, britagem, reformas, capacitação e mais. Toque em qualquer foto para ampliá-la.',
      empty: 'A galeria estará disponível em breve.',
    };
    const es = {
      kicker: 'Galería',
      title: 'Nuestros servicios en acción.',
      lede: 'Registros reales de campo, organizados por servicio: mantenimiento, trituración, reparaciones, capacitación y más. Toca cualquier foto para ampliarla.',
      empty: 'La galería estará disponible en breve.',
    };
    return { L: lang === 'es' ? es : pt };
  }
}

</script>
</body>
</html>
